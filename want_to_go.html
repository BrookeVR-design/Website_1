<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Want-To-Go Restaurants</title>
    <link rel="stylesheet" href="https://use.typekit.net/dfp2uce.css">
    <link rel="stylesheet" href="stylewant.css">
    <link rel="icon" type="image/x-icon" href="./logo.svg">
</head>
<body>
    <div id="pageLoader" class="page-loader" role="status" aria-live="polite">
        <span class="loader-spinner" aria-hidden="true"></span>
        <p>Loading restaurants...</p>
    </div>

    <nav id="navbar" role="banner">
        <div class="nav-inner">
            <a href="index.html" aria-label="Home">
                <img src="logowhite.svg" alt="Logo">
            </a>
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="restaurants.html">Restaurants</a></li>
                <li><a href="cafes.html">Cafes</a></li>
                <li><a href="want_to_go.html">Want-To-Go</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-container">
        <h1>Want-To-Go Restaurants</h1>
        <h2 class="intro">Below is a list of restaurants in Athens, GA that I want to try! You can filter the list by cuisine and star rating.</h2>
        <div class="filters-row">
            <div class="dropdown">
                <button id="dropBtn" type="button" aria-haspopup="true" aria-expanded="false">
                    Choose a Cuisine ▾
                </button>
                <div id="dropMenu" class="menu" role="menu" aria-label="Cuisine options">
                    <button type="button" data-value="all" role="menuitem">All Cuisines</button>
                    <button type="button" data-value="mediterranean" role="menuitem">Mediterranean</button>
                    <button type="button" data-value="italian" role="menuitem">Italian</button>
                    <button type="button" data-value="steak-house" role="menuitem">Steak House</button>
                    <button type="button" data-value="fried-chicken" role="menuitem">Fried Chicken</button>
                    <button type="button" data-value="southern" role="menuitem">Southern</button>
                    <button type="button" data-value="pizza" role="menuitem">Pizza</button>
                    <button type="button" data-value="southeast-asian" role="menuitem">Southeast Asian</button>
                    <button type="button" data-value="japanese" role="menuitem">Japanese</button>
                    <button type="button" data-value="indian" role="menuitem">Indian</button>
                    <button type="button" data-value="mexican" role="menuitem">Mexican</button>
                    <button type="button" data-value="american" role="menuitem">American</button>
                    <button type="button" data-value="jamaican" role="menuitem">Jamaican</button>
                    <button type="button" data-value="thai" role="menuitem">Thai</button>
                    <button type="button" data-value="vietnamese" role="menuitem">Vietnamese</button>
                    <button type="button" data-value="seafood" role="menuitem">Seafood</button>
                </div>
            </div>
            <div class="rating-control">
                <label for="starRating">Star Rating: <span id="starRatingValue">3.0</span></label>
                <input type="range" id="starRating" min="3" max="5" step="0.1" value="3.0">
            </div>
        </div>

        <p id="restaurantStatus" role="status" aria-live="polite">Loading restaurants...</p>
        <section id="restaurantGrid" class="restaurant-grid" aria-label="Restaurants to try"></section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
